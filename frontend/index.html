<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPilot — AI SRE Command Center</title>
    <!-- Local Tailwind Runtime -->
    <script src="/dashboard/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#06090e',
                            900: '#0a0e17',
                            850: '#0f1726',
                            800: '#141f33',
                            750: '#1a2842',
                            700: '#22324e',
                        },
                        sre: {
                            blue: '#38bdf8',
                            cyan: '#06b6d4',
                            indigo: '#6366f1',
                            healthy: '#10b981',
                            warning: '#f59e0b',
                            critical: '#f43f5e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Courier New', 'monospace']
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body class="bg-navy-950 text-slate-200 font-sans antialiased h-screen overflow-hidden flex flex-col selection:bg-sky-500/30 selection:text-sky-200">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden" onclick="closeMobileSidebar()"></div>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Left Navigation Sidebar (Desktop persistent, Mobile off-canvas drawer) -->
        <aside id="app-sidebar" class="w-64 bg-navy-900 border-r border-navy-700/60 flex flex-col justify-between transition-all duration-200 select-none z-30 shrink-0">
            <!-- Brand Header -->
            <div>
                <div class="h-16 px-4 border-b border-navy-700/50 flex items-center justify-between">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <!-- Custom SRE Radar Mark -->
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-sky-500/20 via-indigo-500/10 to-sky-600/30 border border-sky-400/30 flex items-center justify-center shrink-0 shadow-inner">
                            <svg class="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 3v9l6 3"></path>
                                <circle cx="12" cy="12" r="2" class="fill-sky-400/40"></circle>
                            </svg>
                        </div>
                        <div class="sidebar-text truncate">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-base text-white tracking-tight">OpsPilot</span>
                                <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-sky-950 border border-sky-700/60 text-sky-300 font-semibold">SRE</span>
                            </div>
                            <div class="text-[11px] text-slate-400 font-medium tracking-wide">AI Reliability Platform</div>
                        </div>
                    </div>
                    <!-- Desktop Collapse Toggle -->
                    <button id="btn-toggle-sidebar" class="hidden md:block p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-navy-800 transition-colors" title="Toggle Navigation">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <!-- Mobile Close Button -->
                    <button onclick="closeMobileSidebar()" class="md:hidden p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-navy-800 transition-colors" title="Close Menu">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Navigation List -->
                <nav class="p-3 space-y-1">
                    <button onclick="nav('overview')" id="nav-overview" class="nav-item active w-full" title="Overview">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        </svg>
                        <span class="sidebar-text">Overview</span>
                    </button>

                    <button onclick="nav('services')" id="nav-services" class="nav-item w-full" title="Services">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="8" rx="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                        <span class="sidebar-text">Services</span>
                    </button>

                    <button onclick="nav('anomalies')" id="nav-anomalies" class="nav-item w-full" title="Anomalies">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                        <span class="sidebar-text flex-1 text-left">Anomalies</span>
                        <span id="badge-anomalies-count" class="sidebar-text text-[10px] font-mono font-semibold px-1.5 py-0.2 rounded bg-navy-850 text-slate-400 border border-navy-700">0</span>
                    </button>

                    <button onclick="nav('incidents')" id="nav-incidents" class="nav-item w-full" title="Incidents">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span class="sidebar-text flex-1 text-left">Incidents</span>
                        <span id="badge-incidents-count" class="sidebar-text text-[10px] font-mono font-semibold px-1.5 py-0.2 rounded bg-rose-950/60 text-rose-300 border border-rose-800/60">0</span>
                    </button>

                    <button onclick="nav('knowledge')" id="nav-knowledge" class="nav-item w-full" title="Knowledge Base">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span class="sidebar-text">Knowledge Base</span>
                    </button>

                    <button onclick="nav('investigations')" id="nav-investigations" class="nav-item w-full" title="AI Investigations">
                        <svg class="w-4 h-4 shrink-0 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="16" x2="8" y2="16.01"></line>
                            <line x1="16" y1="16" x2="16.01" y2="16"></line>
                        </svg>
                        <span class="sidebar-text font-semibold text-sky-300">AI Investigations</span>
                    </button>
                </nav>
            </div>

            <!-- Sidebar Footer Status -->
            <div class="p-3 border-t border-navy-700/50 space-y-2">
                <div class="sidebar-text p-2.5 rounded-lg bg-navy-850/80 border border-navy-700/50 text-xs space-y-2">
                    <div class="flex items-center justify-between text-slate-400 text-[11px]">
                        <span>DETECTOR</span>
                        <span class="text-sky-300 font-mono font-semibold">IsolationForest</span>
                    </div>
                    <div class="flex items-center justify-between text-slate-400 text-[11px]">
                        <span>MODEL</span>
                        <span id="sidebar-model-tag" class="text-indigo-300 font-mono font-semibold truncate max-w-[100px]">qwen3.5:2b</span>
                    </div>
                </div>
                <div class="sidebar-text text-[10px] text-slate-400 text-center flex items-center justify-between px-1">
                    <span>OpsPilot v0.1.0</span>
                    <span class="text-slate-400">Windows/Local</span>
                </div>
            </div>
        </aside>

        <!-- Main Body Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-navy-950">
            <!-- Top Command Bar -->
            <header class="h-16 px-4 sm:px-6 bg-navy-900/90 border-b border-navy-700/60 flex items-center justify-between shrink-0 surface-overlay z-20">
                <!-- Mobile Hamburger + Page Title -->
                <div class="flex items-center space-x-3 min-w-0">
                    <!-- Hamburger Button for Mobile -->
                    <button onclick="toggleMobileSidebar()" class="md:hidden p-1.5 text-slate-300 hover:text-white rounded-md hover:bg-navy-800 transition-colors" title="Open Navigation">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>

                    <div class="min-w-0">
                        <div class="flex items-center space-x-2">
                            <h1 id="page-title" class="text-base font-semibold text-white tracking-tight truncate">Overview</h1>
                            <span id="page-badge" class="badge badge-low text-[10px]">LIVE</span>
                        </div>
                        <p id="page-desc" class="text-xs text-slate-400 truncate hidden sm:block">System reliability status, telemetry distribution, and incident alerts.</p>
                    </div>
                </div>

                <!-- Right Controls: Health, Model Status, Refresh -->
                <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                    <!-- Global Health Pill -->
                    <div id="system-health-pill" class="flex items-center space-x-1.5 sm:space-x-2 px-2.5 sm:px-3 py-1.5 rounded-full bg-emerald-950/60 border border-emerald-800/60 text-xs font-medium text-emerald-300">
                        <span class="beacon beacon-healthy"></span>
                        <span id="system-health-label" class="font-semibold tracking-wider text-[10px] sm:text-[11px] whitespace-nowrap">OPERATIONAL</span>
                    </div>

                    <!-- Compact Service Status Badges (Hidden on mobile) -->
                    <div class="hidden md:flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-navy-850 border border-navy-700/60 text-xs">
                        <div class="flex items-center space-x-1.5" title="Backend FastAPI status">
                            <span id="dot-backend" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="text-slate-300 font-mono text-[11px]">API</span>
                        </div>
                        <span class="text-navy-700">|</span>
                        <div class="flex items-center space-x-1.5" title="Knowledge Base RAG status">
                            <span id="dot-rag" class="w-2 h-2 rounded-full bg-sky-500"></span>
                            <span class="text-slate-300 font-mono text-[11px]">RAG</span>
                        </div>
                    </div>

                    <!-- Sync/Refresh Button -->
                    <button id="btn-refresh" onclick="triggerRefresh()" class="btn-secondary h-9 px-2.5 sm:px-3" title="Refresh Telemetry">
                        <svg id="refresh-icon" class="w-3.5 h-3.5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span class="hidden lg:inline text-xs font-mono text-slate-300" id="last-updated-text">Synced</span>
                    </button>
                </div>
            </header>

            <!-- Main Scrollable Content Viewport -->
            <main class="flex-1 overflow-y-auto p-4 sm:p-6" id="app-content">
                <!-- Dynamically populated by app.js -->
            </main>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Main Application Script -->
    <script src="/dashboard/app.js"></script>
</body>
</html>
